<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Expense Dashboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

*{box-sizing:border-box;font-family:'Inter',sans-serif;transition:.35s ease;}

html{scroll-behavior:smooth;}

body{
margin:0;
background:radial-gradient(circle at top,#020617,#020617 40%,#0f172a);
color:#e5f3ff;
animation:fadeIn 1.2s ease;
}

/* ===== NAVBAR ===== */
.navbar{
position:sticky;
top:0;
z-index:999;
background:linear-gradient(90deg,#020617,#0f172a,#020617);
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 40px;
box-shadow:0 10px 30px rgba(56,189,248,.5);
animation:slideDown .7s ease;
}

.nav-logo{
font-size:24px;
font-weight:800;
background:linear-gradient(45deg,#38bdf8,#22d3ee);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-links{display:flex;gap:25px;}

.nav-links a{
text-decoration:none;
color:#bae6fd;
font-weight:600;
padding:8px 16px;
border-radius:14px;
}

.nav-links a:hover{
background:rgba(56,189,248,.15);
color:#22d3ee;
box-shadow:0 0 15px rgba(56,189,248,.5);
}

.menu-btn{display:none;font-size:28px;cursor:pointer;color:#7dd3fc;}

@media(max-width:800px){
.nav-links{
position:absolute;
top:70px;
right:0;
background:#020617;
flex-direction:column;
width:220px;
padding:20px;
display:none;
}
.nav-links.show{display:flex;}
.menu-btn{display:block;}
}

/* ===== HEADER ===== */
header{
padding:50px 20px;
text-align:center;
background:linear-gradient(135deg,#020617,#0f172a);
}

header h1{
font-size:44px;
background:linear-gradient(45deg,#38bdf8,#22d3ee);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:glow 2s infinite alternate;
}

header h2{color:#7dd3fc;margin-top:10px;}

/* ===== LAYOUT ===== */
.container{
max-width:1300px;
margin:auto;
padding:40px;
display:grid;
grid-template-columns:1fr 1.6fr;
gap:35px;
}

/* ===== CARD ===== */
.card{
background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
border-radius:24px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,.7);
backdrop-filter:blur(18px);
animation:floatIn .8s ease forwards;
opacity:0;
}

.card:nth-child(1){animation-delay:.2s;}
.card:nth-child(2){animation-delay:.4s;}

.card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 30px 80px rgba(56,189,248,.6);
}

/* ===== FORMS ===== */
label{margin-top:15px;display:block;color:#bae6fd;}

input,select,textarea{
width:100%;
padding:14px;
margin-top:8px;
background:#020617;
color:white;
border:1px solid rgba(56,189,248,.5);
border-radius:14px;
}

input:focus,select:focus,textarea:focus{
outline:none;
box-shadow:0 0 20px rgba(56,189,248,.7);
}

button{
width:100%;
padding:16px;
margin-top:18px;
background:linear-gradient(45deg,#38bdf8,#22d3ee);
border:none;
border-radius:16px;
font-weight:700;
cursor:pointer;
color:#020617;
position:relative;
overflow:hidden;
}

button::before{
content:"";
position:absolute;
width:120%;
height:120%;
background:linear-gradient(120deg,transparent,#ffffff80,transparent);
top:-50%;
left:-120%;
transition:.6s;
}

button:hover::before{left:120%;}
button:hover{transform:scale(1.05);box-shadow:0 0 30px #38bdf8;}

/* ===== SUMMARY ===== */
.summary{display:flex;gap:20px;margin-top:20px;}

.summary div{
flex:1;
background:#020617;
padding:22px;
border-radius:18px;
text-align:center;
}

.summary div:hover{
transform:translateY(-8px) scale(1.05);
box-shadow:0 0 30px rgba(56,189,248,.7);
}

/* ===== TABLE ===== */
table{width:100%;margin-top:20px;border-collapse:collapse;}
th{color:#7dd3fc;padding:12px;border-bottom:2px solid rgba(56,189,248,.5);}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.1);}
tbody tr:hover{background:rgba(56,189,248,.12);transform:scale(1.01);}

.actions button{
width:auto;
padding:6px 12px;
border-radius:10px;
background:#ef4444;
color:white;
}

/* ===== CHART ===== */
canvas{
margin-top:25px;
width:100%;
background:white;
border-radius:20px;
padding:15px;
}

/* ===== FOOTER ===== */
footer{
margin-top:60px;
padding:30px;
text-align:center;
background:#020617;
animation:fadeIn 2s ease;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes floatIn{to{opacity:1;transform:translateY(0);}}
@keyframes slideDown{from{transform:translateY(-100%);}to{transform:translateY(0);}}
@keyframes glow{from{text-shadow:0 0 20px #38bdf8;}to{text-shadow:0 0 40px #22d3ee;}}
</style>
</head>

<body>

<div class="navbar">
<div class="nav-logo">Expenses Tracker</div>
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div class="nav-links" id="navLinks">
<a href="#home">Dashboard</a>
<a href="#add">Add</a>
<a href="#records">Records</a>
<a href="#footer">About</a>
</div>
</div>

<header id="home">
<h1>Expensex Tracker Management System</h1>
<h2>Analyze And Control Your Expenses</h2>
</header>

<div class="container">

<div class="card" id="add">
<h2>Add / Update Expense</h2>
<input type="hidden" id="editIndex">
<label>Amount</label><input type="number" id="amount">
<label>Category</label>
<select id="category">
<option>Food</option><option>Transport</option><option>Utilities</option>
<option>Entertainment</option><option>Education</option><option>Other</option>
</select>
<label>Date</label><input type="date" id="date">
<label>Description</label><textarea id="description"></textarea>
<button onclick="saveExpense()">Save Expense</button>
</div>

<div class="card" id="records">
<h2>Expense Records</h2>
<div class="summary">
<div><h3>Weekly Total</h3><p id="weeklyTotal">0</p></div>
<div><h3>Monthly Total</h3><p id="monthlyTotal">0</p></div>
</div>
<table>
<thead><tr><th>Amount</th><th>Category</th><th>Date</th><th>Description</th><th>Action</th></tr></thead>
<tbody id="expenseTable"></tbody>
</table>
<canvas id="chart" width="400" height="200"></canvas>
</div>

</div>

<footer>
  <p>&copy; 2026 Personal Expense Tracker. All rights reserved.</p>
  <div class="social-icons">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
  </div>
</footer>

<script>
let expenses=JSON.parse(localStorage.getItem("expenses"))||[];

function saveExpense(){
let a=amount.value,c=category.value,d=date.value,desc=description.value,i=editIndex.value;
if(!a||!d){alert("Amount and Date required");return;}
let e={amount:Number(a),category:c,date:d,description:desc};
if(i==="")expenses.push(e);else{expenses[i]=e;editIndex.value="";}
localStorage.setItem("expenses",JSON.stringify(expenses));
amount.value="";date.value="";description.value="";
render();
}

function render(){
expenseTable.innerHTML="";
expenses.forEach((e,i)=>{
expenseTable.innerHTML+=`<tr>
<td>${e.amount}</td><td>${e.category}</td><td>${e.date}</td><td>${e.description}</td>
<td class="actions"><button style="background:#38bdf8" onclick="editExpense(${i})">Edit</button>
<button onclick="deleteExpense(${i})">Delete</button></td></tr>`;
});
calculateSummary();drawChart();
}

function editExpense(i){
let e=expenses[i];
amount.value=e.amount;category.value=e.category;date.value=e.date;description.value=e.description;editIndex.value=i;
}

function deleteExpense(i){
expenses.splice(i,1);localStorage.setItem("expenses",JSON.stringify(expenses));render();
}

function calculateSummary(){
let now=new Date(),w=0,m=0;
expenses.forEach(e=>{
let d=new Date(e.date),diff=(now-d)/(1000*60*60*24);
if(diff<=7)w+=e.amount;
if(d.getMonth()===now.getMonth())m+=e.amount;
});
weeklyTotal.innerText=w;monthlyTotal.innerText=m;
}

function drawChart(){
let c=document.getElementById("chart"),ctx=c.getContext("2d");
ctx.clearRect(0,0,c.width,c.height);
let cat={};
expenses.forEach(e=>cat[e.category]=(cat[e.category]||0)+e.amount);
let k=Object.keys(cat);
if(k.length==0)return;
let max=Math.max(...Object.values(cat),1),bw=c.width/k.length,step=0;
function animate(){
ctx.clearRect(0,0,c.width,c.height);
k.forEach((x,i)=>{
let h=Math.min(step,(cat[x]/max)*150);
ctx.fillStyle="#38bdf8";
ctx.fillRect(i*bw+20,c.height-h-20,bw-40,h);
ctx.fillStyle="#020617";
ctx.fillText(x,i*bw+30,c.height-5);
});
step+=5;
if(step<160)requestAnimationFrame(animate);
}
animate();
}

function toggleMenu(){navLinks.classList.toggle("show");}

render();
</script>

</body>
</html>
